name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8

jobs:
  build-arm64:
    name: Build arm64-v8a release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build requirements
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"
          printf 'ANDROID_NDK_HOME=%s\n' "$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_ROOT=%s\n' "$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build arm64 release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleArm64V8aRelease

      - name: Verify APK payload
        run: |
          APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -s "$APK"
          unzip -tq "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libxray.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libsetuidgid.so'
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsteriskNG-arm64-v8a-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            apk-sha256.txt
